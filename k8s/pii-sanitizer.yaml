apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-sanitizer
  namespace: kong-ai-compliance
  labels:
    app.kubernetes.io/name: pii-sanitizer
    app.kubernetes.io/component: privacy-firewall
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pii-sanitizer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pii-sanitizer
        app.kubernetes.io/name: pii-sanitizer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: pii-sanitizer
          image: ghcr.io/vfcarida/kong-ai-gateway-bcb-compliance/pii-sanitizer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8443"
            - name: SSL_KEYFILE
              value: "/app/certs/dev-key.pem"
            - name: SSL_CERTFILE
              value: "/app/certs/dev-cert.pem"
            - name: ENABLE_MOCK_LLM
              value: "false"
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: pii-sanitizer
  namespace: kong-ai-compliance
  labels:
    app.kubernetes.io/name: pii-sanitizer
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app: pii-sanitizer
