# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Kong AI Gateway — Enterprise Declarative Configuration (decK v3.0)         ║
# ║  Compliance Framework: BCB CMN 4893/21 & BCB 85/21                           ║
# ║                                                                            ║
# ║  ⚠️ ENTERPRISE LICENSE & INFRASTRUCTURE PREREQUISITES:                       ║
# ║   1. KONG_LICENSE_DATA: Must be populated with a valid Kong Enterprise       ║
# ║      license payload in .env or container environment.                     ║
# ║   2. Redis Vector Database: Requires redis-vector running RedisStack 7.2+   ║
# ║      with RediSearch index capability on port 6379.                         ║
# ║   3. OpenAI Embeddings Key: OPENAI_API_KEY required to compute vectors      ║
# ║      via text-embedding-3-small for semantic cache lookups.                 ║
# ║                                                                            ║
# ║  Features Included:                                                        ║
# ║   • All OSS Plugins (PII Sanitizer, OTel Scrubber, AI Proxy, Audit Log)      ║
# ║   • ai-semantic-cache (Enterprise FinOps Vector Caching)                    ║
# ║   • ai-rate-limiting-advanced (Enterprise Token Budget Limiter - OWASP 10)   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

_format_version: "3.0"

services:
  - name: llm-gateway-service
    url: https://pii-sanitizer:8443/mock-llm
    protocol: https
    read_timeout: 60000
    write_timeout: 60000
    connect_timeout: 10000
    retries: 3

    routes:
      - name: llm-proxy-route
        paths:
          - /llm-proxy
        methods:
          - POST
        strip_path: true
        protocols:
          - http
          - https

    plugins:
      # ── 1. Custom Brazilian PII Sanitizer (BCB CMN 4893/21) ─────────────────
      # Encrypted transport via TLS to sanitizer microservice (BCB CMN 4893/21)
      - name: bcb-pii-sanitizer
        config:
          sanitizer_url: "https://pii-sanitizer:8443/sanitize"
          timeout_ms: 5000
          redact_type: "{vault://env/PII_REDACT_TYPE}"
          cache_ttl_seconds: 300
          fail_open: false
          ssl_verify: false # Self-signed dev certificate in compose; set true with CA in production
          # Opt-in fail-open override example (requires documented risk acceptance per route):
          # fail_open: true # RISK ACCEPTANCE: May forward unredacted prompts if sanitizer microservice is unavailable

      # ── 2. OpenTelemetry GenAI Privacy Scrubber (Log Serialization) ──────────
      # Sanitizes Kong log serialization dictionary (kong.log.set_serialize_value)
      # for file-log and compliance audit sinks.
      - name: bcb-otel-scrubber
        config:
          scrub_prompt: true
          scrub_completion: true
          replacement_text: "[REDACTED_BY_BCB_COMPLIANCE_POLICY]"

      # ── 3. OpenTelemetry Tracing Export (Distributed APM Telemetry) ───────────
      # Exports OTLP spans to otel-collector, where attributes/redact_genai processor
      # strips prompt/completion text before forwarding to external APM collectors.
      - name: opentelemetry
        config:
          endpoint: "http://otel-collector:4318/v1/traces"
          resource_attributes:
            service.name: "kong-ai-gateway"
          header_type: "w3c"

      # ── 4. AI Prompt Guard (OWASP LLM01:2025 Prompt Injection Defense) ──────
      - name: ai-prompt-guard
        config:
          allow_patterns: []
          deny_patterns:
            - "(?i)ignore\\s+all\\s+previous\\s+instructions"
            - "(?i)system\\s+override"
            - "(?i)bypass\\s+guardrails"
            - "(?i)reveal\\s+system\\s+prompt"
          match_all_roles: true

      # ── 5. AI Semantic Cache (Enterprise FinOps Vector Cache) ───────────────
      # Requires: Kong Enterprise License + Redis Vector DB + OpenAI Embeddings
      - name: ai-semantic-cache
        config:
          embeddings:
            auth: {}
            model:
              name: "text-embedding-3-small"
              provider: "openai"
          vectordb:
            strategy: "redis"
            redis:
              host: "redis-vector"
              port: 6379
              distance_threshold: 0.85

      # ── 6. AI Token Rate Limiting (Enterprise OWASP LLM10 Token Budgets) ────
      # Requires: Kong Enterprise License + Redis backend
      - name: ai-rate-limiting-advanced
        config:
          llm_providers:
            - provider: "openai"
              limit: 50000 # 50k tokens per minute limit
              window_size: 60
              sync_rate: 10
              cost_strategy: "tokens"
          redis:
            host: "redis-vector"
            port: 6379

      # ── 7. AI Proxy & Provider Failover Routing ─────────────────────────────
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          auth:
            allow_override: false
          model:
            provider: "{vault://env/AI_PROVIDER}"
            name: "{vault://env/AI_MODEL_NAME}"
            options:
              bedrock:
                aws_region: "{vault://env/AWS_REGION}"
                aws_access_key_id: "{vault://env/AWS_ACCESS_KEY_ID}"
                aws_secret_access_key: "{vault://env/AWS_SECRET_ACCESS_KEY}"
              openai:
                upstream_url: "{vault://env/AI_UPSTREAM_URL}"
          logging:
            log_statistics: true
            log_payloads: false

      # ── 8. Regulatory Audit Trail Logging (BCB 85/21) ──────────────────────
      - name: file-log
        config:
          path: "/tmp/audit-logs/kong-audit.log"
          reopen: true

      # ── 9. Request Traceability & Audit Correlation ───────────────────────────
      - name: correlation-id
        config:
          header_name: "X-Request-ID"
          generator: "uuid#counter"
          echo_downstream: true
