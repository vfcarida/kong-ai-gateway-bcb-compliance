# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Kong AI Gateway — Declarative Configuration (decK v3.0)                    ║
# ║  Compliance Framework: BCB CMN 4893/21 & BCB 85/21                           ║
# ║                                                                            ║
# ║  Configured Plugins & Features:                                            ║
# ║   1. bcb-pii-sanitizer: Pre-request PII detection & obfuscation            ║
# ║   2. bcb-otel-scrubber: OpenTelemetry GenAI privacy payload scrubbing      ║
# ║   3. ai-proxy: Provider abstraction & SigV4 / bearer authentication        ║
# ║   4. ai-semantic-cache: Redis Vector Search caching (FinOps optimization)  ║
# ║   5. ai-rate-limiting-advanced: Token-based budgets (OWASP LLM10)          ║
# ║   6. ai-prompt-guard: Semantic guardrails against prompt injection (LLM01) ║
# ║   7. correlation-id: Request tracking & non-repudiable audit logging       ║
# ║   8. file-log: Regulatory audit log serialization                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

_format_version: "3.0"

services:
  - name: llm-gateway-service
    url: http://pii-sanitizer:8088/mock-llm
    protocol: http
    read_timeout: 60000
    write_timeout: 60000
    connect_timeout: 10000
    retries: 3

    routes:
      - name: llm-proxy-route
        paths:
          - /llm-proxy
        methods:
          - POST
        strip_path: true
        protocols:
          - http
          - https

    plugins:
      # ── 1. Custom Brazilian PII Sanitizer (BCB CMN 4893/21) ─────────────────
      - name: bcb-pii-sanitizer
        config:
          sanitizer_url: "http://pii-sanitizer:8088/sanitize"
          timeout_ms: 5000
          redact_type: "{vault://env/PII_REDACT_TYPE}"
          cache_ttl_seconds: 300
          fail_open: false
          # Opt-in fail-open override example (requires documented risk acceptance per route):
          # fail_open: true # RISK ACCEPTANCE: May forward unredacted prompts if sanitizer microservice is unavailable

      # ── 2. OpenTelemetry GenAI Privacy Scrubber ──────────────────────────────
      - name: bcb-otel-scrubber
        config:
          scrub_prompt: true
          scrub_completion: true
          replacement_text: "[REDACTED_BY_BCB_COMPLIANCE_POLICY]"

      # ── 3. AI Prompt Guard (OWASP LLM01:2025 Prompt Injection Defense) ──────
      - name: ai-prompt-guard
        config:
          allow_patterns: []
          deny_patterns:
            - "(?i)ignore\\s+all\\s+previous\\s+instructions"
            - "(?i)system\\s+override"
            - "(?i)bypass\\s+guardrails"
            - "(?i)reveal\\s+system\\s+prompt"
          match_all_roles: true

      # ── 4. AI Semantic Cache (FinOps Vector Search Cache) ───────────────────
      - name: ai-semantic-cache
        config:
          embeddings:
            auth: {}
            model:
              name: "text-embedding-3-small"
              provider: "openai"
          vectordb:
            strategy: "redis"
            redis:
              host: "redis-vector"
              port: 6379
              distance_threshold: 0.85

      # ── 5. AI Token Rate Limiting (OWASP LLM10:2025 Unbounded Consumption) ──
      - name: ai-rate-limiting-advanced
        config:
          llm_providers:
            - provider: "openai"
              limit: 50000 # 50k tokens per minute limit
              window_size: 60
              sync_rate: 10
              cost_strategy: "tokens"
          redis:
            host: "redis-vector"
            port: 6379

      # ── 6. AI Proxy & Provider Failover Routing ─────────────────────────────
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          auth:
            allow_override: false
          model:
            provider: "{vault://env/AI_PROVIDER}"
            name: "{vault://env/AI_MODEL_NAME}"
            options:
              bedrock:
                aws_region: "{vault://env/AWS_REGION}"
                aws_access_key_id: "{vault://env/AWS_ACCESS_KEY_ID}"
                aws_secret_access_key: "{vault://env/AWS_SECRET_ACCESS_KEY}"
              openai:
                upstream_url: "{vault://env/AI_UPSTREAM_URL}"
          logging:
            log_statistics: true
            log_payloads: false

      # ── 7. Regulatory Audit Trail Logging (BCB 85/21) ──────────────────────
      - name: file-log
        config:
          path: "/tmp/audit-logs/kong-audit.log"
          reopen: true

      # ── 8. Request Traceability & Non-Repudiation ───────────────────────────
      - name: correlation-id
        config:
          header_name: "X-Request-ID"
          generator: "uuid#counter"
          echo_downstream: true
