# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Kong AI Gateway — Open-Source (OSS) Declarative Configuration               ║
# ║  Compliance Framework: BCB CMN 4893/21 & BCB 85/21                           ║
# ║                                                                            ║
# ║  Zero-License Required: All plugins below run on Kong Community Edition (OSS)║
# ║  Configured Plugins:                                                       ║
# ║   1. bcb-pii-sanitizer: Pre-request PII detection & obfuscation (Custom)    ║
# ║   2. bcb-otel-scrubber: GenAI privacy log serialization scrubber (Custom)   ║
# ║   3. opentelemetry: Distributed tracing export to OTel Collector (OSS)      ║
# ║   4. ai-prompt-guard: Semantic guardrails against prompt injection (LLM01)   ║
# ║   5. ai-proxy: Multi-provider abstraction & failover routing (OSS)          ║
# ║   6. file-log: Regulatory audit log serialization (BCB 85/21)                ║
# ║   7. correlation-id: Request tracking & structured audit logging            ║
# ║                                                                            ║
# ║  Excluded (Enterprise Only):                                               ║
# ║   • ai-semantic-cache (Requires Kong Gateway Enterprise + Redis Vector)      ║
# ║   • ai-rate-limiting-advanced (Requires Kong Gateway Enterprise)             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

_format_version: "3.0"

services:
  - name: llm-gateway-service
    url: https://pii-sanitizer:8443/mock-llm
    protocol: https
    read_timeout: 60000
    write_timeout: 60000
    connect_timeout: 10000
    retries: 3

    routes:
      - name: llm-proxy-route
        paths:
          - /llm-proxy
        methods:
          - POST
        strip_path: true
        protocols:
          - http
          - https

    plugins:
      # ── 1. Custom Brazilian PII Sanitizer (BCB CMN 4893/21) ─────────────────
      # Encrypted transport via TLS to sanitizer microservice (BCB CMN 4893/21)
      - name: bcb-pii-sanitizer
        config:
          sanitizer_url: "https://pii-sanitizer:8443/sanitize"
          timeout_ms: 5000
          redact_type: "{vault://env/PII_REDACT_TYPE}"
          cache_ttl_seconds: 300
          fail_open: false
          ssl_verify: false # Self-signed dev certificate in compose; set true with CA in production
          # Opt-in fail-open override example (requires documented risk acceptance per route):
          # fail_open: true # RISK ACCEPTANCE: May forward unredacted prompts if sanitizer microservice is unavailable

      # ── 2. OpenTelemetry GenAI Privacy Scrubber (Log Serialization) ──────────
      # Sanitizes Kong log serialization dictionary (kong.log.set_serialize_value)
      # for file-log and compliance audit sinks.
      - name: bcb-otel-scrubber
        config:
          scrub_prompt: true
          scrub_completion: true
          replacement_text: "[REDACTED_BY_BCB_COMPLIANCE_POLICY]"

      # ── 3. OpenTelemetry Tracing Export (Distributed APM Telemetry) ───────────
      # Exports OTLP spans to otel-collector, where attributes/redact_genai processor
      # strips prompt/completion text before forwarding to external APM collectors.
      - name: opentelemetry
        config:
          endpoint: "http://otel-collector:4318/v1/traces"
          resource_attributes:
            service.name: "kong-ai-gateway"
          header_type: "w3c"

      # ── 4. AI Prompt Guard (OWASP LLM01:2025 Prompt Injection Defense) ──────
      - name: ai-prompt-guard
        config:
          allow_patterns: []
          deny_patterns:
            - "(?i)ignore\\s+all\\s+previous\\s+instructions"
            - "(?i)system\\s+override"
            - "(?i)bypass\\s+guardrails"
            - "(?i)reveal\\s+system\\s+prompt"
          match_all_roles: true

      # ── 5. AI Proxy & Provider Routing (OSS Supported) ──────────────────────
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          auth:
            allow_override: false
          model:
            provider: "{vault://env/AI_PROVIDER}"
            name: "{vault://env/AI_MODEL_NAME}"
            options:
              bedrock:
                aws_region: "{vault://env/AWS_REGION}"
                aws_access_key_id: "{vault://env/AWS_ACCESS_KEY_ID}"
                aws_secret_access_key: "{vault://env/AWS_SECRET_ACCESS_KEY}"
              openai:
                upstream_url: "{vault://env/AI_UPSTREAM_URL}"
          logging:
            log_statistics: true
            log_payloads: false

      # ── 6. Regulatory Audit Trail Logging (BCB 85/21) ──────────────────────
      - name: file-log
        config:
          path: "/tmp/audit-logs/kong-audit.log"
          reopen: true

      # ── 7. Request Traceability & Audit Correlation ───────────────────────────
      - name: correlation-id
        config:
          header_name: "X-Request-ID"
          generator: "uuid#counter"
          echo_downstream: true
