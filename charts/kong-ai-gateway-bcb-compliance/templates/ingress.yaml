{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kong-ai-compliance.fullname" . }}
  labels:
    {{- include "kong-ai-compliance.labels" . | nindent 4 }}
  annotations:
    konghq.com/plugins: "{{ include "kong-ai-compliance.fullname" . }}-pii-sanitizer, {{ include "kong-ai-compliance.fullname" . }}-otel-scrubber"
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "kong-ai-compliance.fullname" . }}-sanitizer
                port:
                  number: {{ .Values.service.port }}
{{- end }}
