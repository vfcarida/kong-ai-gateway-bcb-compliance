# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Kong AI Gateway — Enterprise Docker Compose Architecture                    ║
# ║  Compliance Framework: BCB CMN 4893/21 & BCB 85/21                           ║
# ║                                                                            ║
# ║  Services:                                                                 ║
# ║   • kong-gateway    — AI Gateway Control & Data Plane (DB-less 3.14 LTS)  ║
# ║   • pii-sanitizer   — Fast PII Inspection Microservice (FastAPI 3.10+)    ║
# ║   • redis-vector    — Vector Cache for FinOps & Rate-Limiting Engine       ║
# ║   • otel-collector  — OpenTelemetry Collector with Privacy Scrubbing       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  # ── Redis Vector Search Backend (FinOps & Rate Limiting) ──────────────────────
  redis-vector:
    image: redis/redis-stack-server:latest
    container_name: redis-vector
    ports:
      - "6379:6379"
    networks:
      - kong-ai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── PII Sanitizer (FastAPI 3.10+) ──────────────────────────────────────────
  pii-sanitizer:
    build:
      context: ./pii-sanitizer
      dockerfile: Dockerfile
    container_name: pii-sanitizer
    environment:
      - PORT=8088
    ports:
      - "8088:8088"
    networks:
      - kong-ai-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── OpenTelemetry Collector (Privacy Telemetry Pipeline) ─────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-config.yml"]
    volumes:
      - ./config/otel-collector-config.yml:/etc/otelcol-config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - kong-ai-net
    restart: unless-stopped

  # ── Kong Gateway Enterprise (DB-less) ──────────────────────────────────────
  kong-gateway:
    image: kong/kong-gateway:3.14
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yaml
      KONG_PLUGINS: "bundled,bcb-pii-sanitizer,bcb-otel-scrubber"
      KONG_LUA_PACKAGE_PATH: "/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;;"

      KONG_LICENSE_DATA: "${KONG_LICENSE_DATA:-}"

      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"

      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # Cloud Provider Credentials
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"

      # AI Provider Routing
      AI_PROVIDER: "${AI_PROVIDER:-openai}"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-mock-compliance-llm}"
      AI_UPSTREAM_URL: "${AI_UPSTREAM_URL:-http://pii-sanitizer:8088/mock-llm}"

      PII_REDACT_TYPE: "${PII_REDACT_TYPE:-placeholder}"
      KONG_UNTRUSTED_LUA: "on"

    volumes:
      - ./config/kong.yaml:/usr/local/kong/declarative/kong.yaml:ro
      - ./plugins/bcb-pii-sanitizer/kong/plugins/bcb-pii-sanitizer:/usr/local/share/lua/5.1/kong/plugins/bcb-pii-sanitizer:ro
      - ./plugins/bcb-otel-scrubber/kong/plugins/bcb-otel-scrubber:/usr/local/share/lua/5.1/kong/plugins/bcb-otel-scrubber:ro
      - ./logs:/tmp/audit-logs

    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
      - "8002:8002"

    networks:
      - kong-ai-net

    depends_on:
      pii-sanitizer:
        condition: service_healthy
      redis-vector:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

    restart: unless-stopped

networks:
  kong-ai-net:
    name: kong-ai-net
    driver: bridge
