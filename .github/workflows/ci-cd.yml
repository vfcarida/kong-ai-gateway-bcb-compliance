name: Kong AI Gateway — BCB Compliance CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Lua Unit & Integration Tests (Kong Pongo) ──────────────────────
  lua-pongo-tests:
    name: Lua Plugins (Busted & Pongo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kong Pongo
        uses: Kong/setup-pongo@v1
        with:
          pongo-version: "v2.5.0"
          kong-version: "3.14.0"

      - name: Run Pongo Test Suite
        run: |
          pongo run spec/

  # ── Job 2: Python Microservice & MLOps Tests (Pytest) ─────────────────────
  python-pytest-suite:
    name: Python PII Sanitizer & MLOps (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pii-sanitizer/requirements.txt
          pip install pytest pytest-asyncio httpx flake8 mypy

      - name: Run Linters
        run: |
          flake8 pii-sanitizer/app --max-line-length=120
          mypy pii-sanitizer/app --ignore-missing-imports

      - name: Run Pytest Suite
        run: |
          pytest pii-sanitizer/tests/ -v

      - name: Run AI DLP Quantitative Evaluation Benchmark
        run: |
          pytest -s pii-sanitizer/tests/test_ai_eval_metrics.py

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Run Helm Chart Lint
        run: |
          helm lint charts/kong-ai-gateway-bcb-compliance

  # ── Job 3: Integration & Performance Benchmarks (Docker Compose & k6) ─────
  e2e-k6-benchmark:
    name: E2E Integration & Load Test (k6)
    runs-on: ubuntu-latest
    needs: [lua-pongo-tests, python-pytest-suite]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Environment (OSS Profile)
        run: |
          docker compose --profile oss up -d --build
          sleep 15
          docker compose --profile oss ps

      - name: Verify Service Health
        run: |
          # Verify PII Sanitizer TLS endpoint (self-signed dev cert)
          curl -k -f https://localhost:8088/health
          # Verify Kong Gateway status via internal health probe (Admin API is hardened to loopback)
          docker exec kong-gateway-oss kong health

      - name: Run Python E2E Verification Script
        run: |
          pip install requests
          python test_kong_proxy.py

      - name: Install and Run k6 Benchmark
        uses: grafana/setup-k6-action@v1
      - run: |
          k6 run tests/k6/llm_benchmark.js

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose --profile oss down -v
